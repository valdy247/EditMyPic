name: Build and Submit EditMyPic

on:
  push:
    branches: ['main']

jobs:
  build_ios:
    name: Build iOS and deploy API
    type: build
    params:
      platform: ios
      profile: production

  submit_ios:
    name: Upload to App Store Connect
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
